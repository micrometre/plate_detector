services:
  plate-detector:
    build:
      context: .
      dockerfile: Dockerfile
    image: plate-detector:latest
    container_name: uk-plate-detector
    
    # CPU configuration
    environment:
      - CUDA_VISIBLE_DEVICES=""
      - OMP_NUM_THREADS=4
      - MKL_NUM_THREADS=4
      - PYTHONUNBUFFERED=1
    
    # Volume mounts for input/output
    volumes:
      - ./test_data:/app/input:ro           # Read-only input directory
      - ./output:/app/output:rw             # Read-write output directory
      - ./videos:/app/videos:ro             # Optional: for video files
    
    # Keep container running for interactive use
    stdin_open: true
    tty: true
    
    # Restart policy
    restart: unless-stopped
    
    # Resource limits (optional)
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  # Alternative service for video processing  
  plate-detector-video:
    extends: plate-detector
    container_name: uk-plate-detector-video
    command: >
      python deploy/pipeline/pipeline.py
      --config deploy/pipeline/config/infer_cfg_ppvehicle.yml
      --video_file videos/test_video.mp4
      --output_dir output
      --save_video
    profiles:
      - video

# Optional: create named volumes for persistent storage
volumes:
  output-data:
    driver: local